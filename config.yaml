# Killbench Configuration

# LLM Configuration
llms:
  # Doctor: The LLM being tested/evaluated
  doctor:
    provider: "gemini"  # claude, grok, gpt, or gemini
    model: "gemini-3.5-flash"  # Google Gemini 3.5 Flash

  # Referee: Judges whether questions trigger information gates
  referee:
    provider: "claude"
    model: "claude-sonnet-5"

  # Answer Server: Plays roles (patient, nurse, clinician, etc.)
  answer_server:
    provider: "claude"
    model: "claude-sonnet-5"

# Case Configuration
case:
  path: "cases_dev/KB-AF-NEW-ONSET-004.yaml"
  max_turns: 25

# Output Configuration
output:
  output_dir: "outputs"
  verbose: true
